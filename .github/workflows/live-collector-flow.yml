name: Live Collector Flow

on:
  pull_request:
    paths:
      - "cossse/**"
      - "examples/live_collector_flow.py"
      - ".github/workflows/live-collector-flow.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  live-collector-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out COSsse
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install COSsse and test tools
        run: python -m pip install -e '.[dev]'

      - name: Install stable Collector v1.0.0
        run: >-
          python -m pip install
          'collector @ git+https://github.com/pbssathya/collector.git@2923a0d24ded7c4e3fff30d9045e0fcd2612d2a4'

      - name: Run COSsse unit tests
        run: python -m pytest -q

      - name: Run one real Flow encounter
        run: >-
          python examples/live_collector_flow.py
          games/chance/lottery/kerala
          75352
